<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Motion demo — Condo Ninja</title>
  <style>
    :root{color-scheme:dark;--ink:#050B1A;--ink2:#101E3A;--signal:#5AC8FF;--paper:#FAFBFD;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#172A4D 0,transparent 35%),var(--ink);color:var(--paper);font:16px/1.5 system-ui,sans-serif}
    main{width:min(760px,calc(100% - 32px));padding:40px;border:1px solid #23385F;border-radius:24px;background:#0A1428;overflow:hidden;position:relative}
    .eyebrow{font:600 12px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
    h1{font-size:clamp(32px,7vw,64px);line-height:.95;margin:18px 0 28px;max-width:10ch}.evidence{display:grid;gap:12px}.row{position:relative;padding:18px 18px 18px 48px;border:1px solid #23385F;border-radius:14px;background:#101E3A;opacity:0;transform:translateY(12px);animation:reveal .55s var(--ease) forwards}.row:nth-child(2){animation-delay:.14s}.row:nth-child(3){animation-delay:.28s}.dot{position:absolute;left:20px;top:23px;width:10px;height:10px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 #5AC8FF66;animation:pulse 1.4s .8s ease-out 1}.scan{position:absolute;inset:0 auto 0 -30%;width:28%;background:linear-gradient(90deg,transparent,#5AC8FF22,transparent);transform:skewX(-12deg);animation:scan 2.4s .25s var(--ease) 1;pointer-events:none}.label{font:500 12px ui-monospace,monospace;color:#9AB0D0;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:4px;font-weight:650}.note{margin-top:24px;color:#9AB0D0;font-size:13px}
    @keyframes reveal{to{opacity:1;transform:none}}@keyframes scan{to{left:120%}}@keyframes pulse{50%{box-shadow:0 0 0 12px #5AC8FF00}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important}.row{opacity:1;transform:none}}
  </style>
</head>
<body><main><div class="scan" aria-hidden="true"></div><div class="eyebrow">Scan → Reveal → Connect</div><h1>Clareza em movimento.</h1><section class="evidence" aria-label="Sequência de análise"><article class="row"><span class="dot"></span><div class="label">Dado</div><div class="value">Contrato identificado</div></article><article class="row"><span class="dot"></span><div class="label">Sinal</div><div class="value">Valor acima do benchmark</div></article><article class="row"><span class="dot"></span><div class="label">Próximo passo</div><div class="value">Validar escopo e cotações comparáveis</div></article></section><div class="note">Demonstração técnica. Respeita a preferência de movimento reduzido do sistema.</div></main></body>
</html>
