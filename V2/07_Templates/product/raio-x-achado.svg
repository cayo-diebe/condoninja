  <rect width="1600" height="1000" fill="#050B1A"/><text x="90" y="90" font-family="Geist Mono" font-size="16" letter-spacing="2" fill="#5AC8FF">RAIO-X DO CONDOMÍNIO · ACHADO 04</text><text x="90" y="195" font-family="Geist" font-size="58" font-weight="600" letter-spacing="-2.3" fill="#FFFFFF"><tspan x="90">Contrato de elevadores</tspan><tspan x="90" dy="64">acima da faixa observada</tspan></text><rect x="90" y="382" width="930" height="360" rx="24" fill="#0A1428" stroke="#23385F"/><rect x="145" y="520" width="790" height="84" fill="#C7ECFF" fill-opacity=".12"/><text x="158" y="548" font-family="Geist Mono" font-size="14" fill="#9ADFFF">FAIXA COMPARÁVEL</text><path d="M145 640C260 630 360 600 470 574s220-24 330-88 105-42 135-60" fill="none" stroke="#5AC8FF" stroke-width="6"/><path d="M770 430v250" stroke="#FF6B5B" stroke-width="3" stroke-dasharray="10 10"/><text x="90" y="800" font-family="Geist" font-size="20" fill="#9AB0D0">Sinal, não conclusão. Diferenças de escopo, região e período precisam ser verificadas.</text><g transform="translate(1080 150)"><rect width="430" height="592" rx="24" fill="#FFFFFF"/><text x="34" y="58" font-family="Geist Mono" font-size="14" letter-spacing="1.5" fill="#0B4BB5">EVIDÊNCIAS</text><circle cx="42" cy="118" r="8" fill="#2DD4BF"/><text x="66" y="116" font-family="Geist" font-size="18" fill="#050B1A">Contrato atual</text><text x="66" y="142" font-family="Geist Mono" font-size="13" fill="#34507F">Confirmado</text><circle cx="42" cy="194" r="8" fill="#2DD4BF"/><text x="66" y="192" font-family="Geist" font-size="18" fill="#050B1A">12 notas fiscais</text><text x="66" y="218" font-family="Geist Mono" font-size="13" fill="#34507F">Confirmado</text><circle cx="42" cy="270" r="8" fill="#F6C453"/><text x="66" y="268" font-family="Geist" font-size="18" fill="#050B1A">3 cotações comparáveis</text><text x="66" y="294" font-family="Geist Mono" font-size="13" fill="#34507F">Parcial</text><circle cx="42" cy="346" r="8" fill="#FF6B5B"/><text x="66" y="344" font-family="Geist" font-size="18" fill="#050B1A">Escopo técnico</text><text x="66" y="370" font-family="Geist Mono" font-size="13" fill="#34507F">Ausente</text><rect x="34" y="452" width="362" height="1" fill="#C9D6EA"/><text x="34" y="497" font-family="Geist" font-size="18" font-weight="600" fill="#050B1A">Confiança do achado</text><text x="34" y="540" font-family="Geist Mono" font-size="28" fill="#F6C453">MÉDIA</text></g><g transform="translate(90 880)">
